name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

env:
  DOTNET_VERSION: 10.0.x
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  APP_NAME: Laba1                         # имя исполняемого файла (задаётся принудительно при publish)
  PROJECT: lb1/laba1/laba1.csproj         # путь к проекту от корня репозитория

jobs:
  # 1. Проверки: lint + тесты + покрытие (переиспользуем ci.yml)
  checks:
    uses: ./.github/workflows/ci.yml

  # 2. Сборка self-contained single-file для трёх платформ
  build:
    name: Build ${{ matrix.rid }}
    needs: checks
    timeout-minutes: 20
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: ubuntu-latest,  rid: linux-x64, archive: tar.gz }
          - { os: windows-latest, rid: win-x64,   archive: zip }
          - { os: macos-latest,   rid: osx-arm64, archive: tar.gz }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish (self-contained, single file)
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          dotnet publish "$PROJECT" \
            -c Release \
            -r "${{ matrix.rid }}" \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:InvariantGlobalization=true \
            -p:DebugType=none \
            -p:AssemblyName="$APP_NAME" \
            -p:Version="$VERSION" \
            -o "publish/${{ matrix.rid }}"

      - name: Smoke test (run the published binary)
        shell: bash
        run: |
          EXE="publish/${{ matrix.rid }}/$APP_NAME"
          if [ "${{ matrix.rid }}" = "win-x64" ]; then EXE="$EXE.exe"; fi
          ls -la "publish/${{ matrix.rid }}"
          OUT="$(printf 'x\n' | "$EXE")"
          echo "$OUT"
          echo "$OUT" | grep -q "3D"

      - name: Package (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path "publish/${{ matrix.rid }}/*" -DestinationPath "dist/$env:APP_NAME-${{ github.ref_name }}-${{ matrix.rid }}.zip"

      - name: Package (tar.gz)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          mkdir -p dist
          tar -C "publish/${{ matrix.rid }}" -czf "dist/${APP_NAME}-${GITHUB_REF_NAME}-${{ matrix.rid }}.tar.gz" .

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.rid }}
          path: dist/*
          if-no-files-found: error

  # 3. Публикация в раздел Releases
  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Release notes
        run: |
          cat > notes.md <<'EOF'
          ## Как запустить
          Установка .NET SDK/Runtime **не требуется**.

          1. Скачайте архив для своей ОС и `SHA256SUMS.txt`.
          2. Проверьте контрольную сумму (необязательно).
          3. Распакуйте архив и запустите файл `Laba1` (`Laba1.exe` на Windows).

          **Windows:** если SmartScreen блокирует запуск, нажмите «Подробнее» → «Выполнить в любом случае» (файл не подписан).

          **macOS:** выполните `xattr -d com.apple.quarantine ./Laba1` и `chmod +x ./Laba1`.

          **Linux:** выполните `chmod +x ./Laba1`.
          EOF

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRERELEASE=""
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then PRERELEASE="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md \
            --generate-notes \
            --verify-tag \
            $PRERELEASE

  # 4. Проверка: скачиваем файлы ИЗ Releases и запускаем на чистых раннерах
  verify:
    name: Verify release (${{ matrix.rid }})
    needs: release
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  rid: linux-x64, archive: tar.gz }
          - { os: windows-latest, rid: win-x64,   archive: zip }
          - { os: macos-latest,   rid: osx-arm64, archive: tar.gz }
    runs-on: ${{ matrix.os }}
    steps:
      - name: Download from Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir verify && cd verify
          gh release download "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "*${{ matrix.rid }}*" \
            --pattern "SHA256SUMS.txt"
          ls -la

      - name: Verify checksum
        shell: bash
        working-directory: verify
        run: |
          grep "${{ matrix.rid }}" SHA256SUMS.txt > check.txt
          if [ "$RUNNER_OS" = "macOS" ]; then
            shasum -a 256 -c check.txt
          else
            sha256sum -c check.txt
          fi

      - name: Extract (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        working-directory: verify
        run: Expand-Archive -Path *.zip -DestinationPath app

      - name: Extract (tar.gz)
        if: matrix.archive == 'tar.gz'
        shell: bash
        working-directory: verify
        run: |
          mkdir app
          tar -xzf *.tar.gz -C app

      - name: Run downloaded binary
        shell: bash
        working-directory: verify/app
        run: |
          EXE="./$APP_NAME"
          if [ "${{ matrix.rid }}" = "win-x64" ]; then EXE="./$APP_NAME.exe"; fi
          chmod +x "$EXE" || true
          OUT="$(printf 'x\n' | "$EXE")"
          echo "$OUT"
          echo "$OUT" | grep -q "3D"
