name: CD Lab 2

on:
  push:
    tags:
      - 'lab2-v*' # Сработает только при пуше тега вида lab2-v1.0.0

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore & Build
      run: |
        dotnet restore lab2/lab2.Tests/lab2.Tests.csproj
        dotnet build lab2/lab2.Tests/lab2.Tests.csproj --configuration Release --no-restore

    - name: Verify Tests Before Release
      run: dotnet test lab2/lab2.Tests/lab2.Tests.csproj --no-build --configuration Release

    - name: Pack Release
      shell: pwsh
      run: Compress-Archive -Path lab2/lab2/bin/Release/* -DestinationPath AirlineSystem-${{ github.ref_name }}.zip

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: AirlineSystem-${{ github.ref_name }}.zip
        generate_release_notes: true
